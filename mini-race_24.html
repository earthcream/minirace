<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ミニキャラ アスレチック レース</title>
<style>
  :root{
    --ink:#231942; --pop:#ff5f7e; --lime:#8ef07a; --sun:#ffd447; --sky:#5ad2ff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#7fd4ff;
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    color:var(--ink); user-select:none; touch-action:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}

  .panel{position:absolute;background:rgba(255,255,255,.88);border:3px solid var(--ink);
    border-radius:18px;padding:8px 14px;font-weight:800;line-height:1.15;
    box-shadow:0 4px 0 var(--ink)}
  #rank{top:14px;left:14px;font-size:15px}
  #rank b{font-size:30px;display:block}
  #back{top:64px;right:14px;pointer-events:auto;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  #back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  #timer{top:14px;right:14px;font-size:22px;font-variant-numeric:tabular-nums}

  #track{position:absolute;left:50%;transform:translateX(-50%);top:16px;
    width:min(52vw,400px);height:14px;background:rgba(255,255,255,.85);
    border:3px solid var(--ink);border-radius:99px;box-shadow:0 4px 0 var(--ink)}
  #track i{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;opacity:.8;
    border-radius:50%;border:2px solid var(--ink);transition:left .1s linear}
  #track i.me{width:15px;height:15px;margin:-7.5px 0 0 -7.5px;z-index:2;opacity:1}

  #center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  #big{font-size:min(22vw,150px);font-weight:900;color:#fff;
    -webkit-text-stroke:6px var(--ink);text-stroke:6px var(--ink);
    letter-spacing:-.02em;opacity:0;transform:scale(.6)}
  #big.go{animation:pop .7s ease-out}
  @keyframes pop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}
    25%{opacity:1;transform:scale(1.15) rotate(2deg)}
    70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}

  #toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-weight:900;font-size:17px;
    padding:8px 18px;border-radius:99px;opacity:0;transition:opacity .3s;white-space:nowrap}

  #boost{bottom:120px;left:14px;font-size:20px;letter-spacing:2px;padding:6px 12px}
  body:not(.touch) #boost{bottom:46px}
  #grab{position:absolute;left:50%;top:34%;transform:translateX(-50%);display:none;
    background:rgba(35,25,66,.9);border:3px solid #fff;border-radius:18px;padding:10px 16px;
    text-align:center;color:#fff;font-weight:900;font-size:min(4.4vw,17px);white-space:nowrap}
  #grab.on{display:block;animation:shake .18s infinite}
  @keyframes shake{0%{margin-left:-3px}50%{margin-left:3px}100%{margin-left:-3px}}
  #grab i{display:block;height:14px;margin-top:8px;background:rgba(255,255,255,.25);
    border-radius:99px;overflow:hidden}
  #grab i b{display:block;height:100%;width:0;background:var(--lime);border-radius:99px;
    transition:width .06s linear}
  #nametag{position:absolute;left:0;top:0;display:none;transform:translate(-50%,-100%);
    padding:3px 11px 3px 4px;border-radius:99px;background:rgba(35,25,66,.85);color:#fff;
    font-size:14px;font-weight:900;white-space:nowrap;border:2px solid #fff;
    align-items:center;gap:7px}
  #nametag.on{display:flex}
  #tagPic{width:30px;height:30px;border-radius:50%;object-fit:cover;
    border:2px solid #fff;display:none;background:#fff}
  #tagPic.on{display:block}
  #telop{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:min(6vw,30px);
    font-weight:900;color:#fff;-webkit-text-stroke:4px var(--ink);opacity:0;transition:opacity .25s}

  #confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  #confetti span{position:absolute;width:11px;height:16px;border-radius:2px;
    animation:fall linear forwards}
  @keyframes fall{from{transform:translateY(-12vh) rotate(0)}
    to{transform:translateY(112vh) rotate(720deg)}}

  #start{position:fixed;inset:0;display:none;z-index:6;overflow:hidden;
    background:linear-gradient(180deg,#8fdcff,#ffd9e8)}
  #start.on{display:flex;align-items:center;justify-content:center}
  #sCard{text-align:center;padding:12px 14px;display:flex;flex-direction:column;
    align-items:center;width:min(96vw,560px);max-height:100%;box-sizing:border-box}
  #sCard h1{font-size:min(7.5vw,38px);margin:0 0 2px;line-height:1.1;color:#fff;
    -webkit-text-stroke:4px var(--ink)}
  #sCard p{margin:0 0 10px;font-weight:800;font-size:14px}
  #picks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    margin-bottom:12px;width:100%;overflow-y:auto;flex:1 1 auto;min-height:0;
    align-content:flex-start;padding:2px}
  .pick{width:78px;padding:8px 5px;background:#fff;border:3px solid var(--ink);
    border-radius:18px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
  .pick.on{background:var(--sun);transform:translateY(-4px)}
  .pick .dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;border:3px solid var(--ink)}
  .pick b{display:block;font-size:13px}
  .pick small{font-size:10px;opacity:.7;font-weight:700}
  #pname{width:min(80vw,260px);padding:10px 14px;margin-bottom:10px;flex:0 0 auto;font:inherit;
    font-size:17px;font-weight:800;text-align:center;color:var(--ink);
    background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink)}
  #pname:focus{outline:none;background:var(--sun)}
  #cam{flex:0 0 auto;display:flex;gap:12px;align-items:center;margin-bottom:12px}
  #camView{position:relative;width:96px;height:96px;border-radius:50%;overflow:hidden;
    border:4px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);flex:0 0 auto}
  #camView video,#camView canvas{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:none;transform:scaleX(-1)}
  #camView.live video{display:block}
  #camView.shot canvas{display:block}
  #camView.live #camOff,#camView.shot #camOff{display:none}
  #camOff{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;
    font-weight:800;color:var(--ink);opacity:.6;text-align:center;line-height:1.3}
  #camBtns{display:flex;flex-direction:column;gap:6px}
  #camBtns button,#camFile{font:inherit;font-size:13px;font-weight:800;color:var(--ink);
    background:#fff;border:3px solid var(--ink);border-radius:12px;padding:7px 14px;
    box-shadow:0 3px 0 var(--ink);cursor:pointer;text-align:center}
  #camBtns button:active,#camFile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  #camShoot{background:var(--pop) !important;color:#fff !important}
  #keys{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;
    margin-bottom:12px;font-size:13px;font-weight:800}
  #keys b{background:var(--sun);border:2px solid var(--ink);border-radius:7px;padding:1px 7px;margin-right:3px}
  #keys .tsp{width:100%;opacity:.7;font-size:12px}
  #go{flex:0 0 auto;padding:13px 30px;font:inherit;font-size:20px;font-weight:900;color:#fff;
    background:var(--pop);border:3px solid var(--ink);border-radius:18px;
    box-shadow:0 6px 0 var(--ink);cursor:pointer}
  #go:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}

  #result{position:fixed;inset:0;display:none;place-items:center;
    background:rgba(35,25,66,.55);backdrop-filter:blur(3px)}
  #result.on{display:grid}
  #card{background:#fffdf6;border:4px solid var(--ink);border-radius:26px;
    padding:18px 20px;max-height:88vh;overflow:auto;min-width:280px;box-shadow:0 8px 0 var(--ink)}
  #card h2{margin:0 0 4px;font-size:30px;text-align:center}
  #card p{margin:0 0 14px;text-align:center;font-size:14px;opacity:.7}
  #list{list-style:none;margin:0 0 18px;padding:0;font-weight:800}
  #list li{display:flex;justify-content:space-between;gap:16px;padding:4px 9px;font-size:14px;
    border-radius:12px;font-variant-numeric:tabular-nums}
  #list li.me{background:var(--sun)}
  #list .no{width:2.2em}
  #again{width:100%;padding:13px;font:inherit;font-size:19px;font-weight:900;
    color:#fff;background:var(--pop);border:3px solid var(--ink);border-radius:16px;
    box-shadow:0 5px 0 var(--ink);cursor:pointer}
  #again:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}

  /* 操作ボタン */
  #pad{position:fixed;inset:auto 0 0 0;padding:0 16px 22px;
    display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
  .btn{pointer-events:auto;width:74px;height:74px;border-radius:50%;
    border:3px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);
    display:grid;place-items:center;font-size:13px;font-weight:900;line-height:1.1}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn.jump{width:92px;height:92px;background:var(--lime);font-size:16px}
  .btn.fwd{background:var(--sky)}
  .btn.dash{background:var(--sun);font-size:12px}
  .grp{display:flex;gap:12px;align-items:flex-end}
  .arrow{font-size:26px}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;text-align:center;
    font-size:14px;font-weight:800;color:var(--ink);background:rgba(255,255,255,.9);
    border:3px solid var(--ink);border-radius:99px;padding:7px 18px;box-shadow:0 4px 0 var(--ink);
    white-space:nowrap}
  #hint b{background:var(--sun);border:2px solid var(--ink);border-radius:7px;padding:1px 7px;margin:0 2px}
  body.touch #hint{display:none}
  body:not(.touch) #pad{display:none}
</style>

<div id="hud">
  <div class="panel" id="rank">じゅんい<b>1<span style="font-size:15px">/30</span></b></div>
  <div class="panel" id="timer">0.00</div>
  <button class="panel" id="back">もどる</button>
  <div id="track"></div>
  <div id="center"><div id="big"></div></div>
  <div id="toast"></div>
  <div class="panel" id="boost"></div>
  <div id="telop"></div>
  <div id="nametag"><img id="tagPic" alt=""><span id="tagName"></span></div>
  <div id="grab"><span>コズにつかまった！ ボタンれんだでにげろ！</span><i><b></b></i></div>
</div>

<div id="pad">
  <div class="grp">
    <div class="btn" id="bL"><span class="arrow">◀</span></div>
    <div class="btn" id="bR"><span class="arrow">▶</span></div>
    <div class="btn dash" id="bD">ダッシュ</div>
  </div>
  <div class="grp">
    <div class="btn fwd" id="bF">すすむ</div>
    <div class="btn jump" id="bJ">ジャンプ</div>
  </div>
</div>
<div id="hint"><b>スペース</b>＝ジャンプ　<b>←→</b>＝ひだり・みぎ　<b>↑</b>＝すすむ　<b>Shift</b>＝ダッシュ（たいあたり）　<b>R</b>＝もどる</div>

<div id="start" class="on">
  <div id="sCard">
    <h1>ミニキャラ<br>アスレチックレース</h1>
    <p>なまえとスキンをえらんでスタート（30人レース）</p>
    <input id="pname" maxlength="8" placeholder="なまえ（8もじまで）" value="あなた">

    <div id="cam">
      <div id="camView">
        <video id="vid" playsinline muted autoplay></video>
        <canvas id="shot"></canvas>
        <span id="camOff">かおの<br>しゃしん</span>
      </div>
      <div id="camBtns">
        <button id="camStart">カメラをつかう</button>
        <button id="camShoot" style="display:none">さつえい</button>
        <button id="camRetry" style="display:none">とりなおす</button>
        <label id="camFile">がぞうをえらぶ<input type="file" accept="image/*" hidden></label>
      </div>
    </div>
    <div id="picks"></div>
    <div id="keys">
      <span><b>スペース</b> ジャンプ</span><span><b>←→</b> ひだり・みぎ</span>
      <span><b>↑</b> すすむ</span><span><b>Shift</b> ダッシュ＝たいあたり</span><span><b>R</b> もどる</span>
      <span class="tsp">スマホは画面下のボタンでそうさ</span>
    </div>
    <button id="go">レースをはじめる</button>
  </div>
</div>

<div id="confetti"></div>

<div id="result"><div id="card">
  <h2 id="rTitle">ゴール！</h2>
  <p id="rSub"></p>
  <ol id="list"></ol>
  <button id="again">もういちど</button>
  <button id="reselect" style="width:100%;margin-top:8px;padding:10px;font:inherit;font-weight:800;background:#fff;border:3px solid var(--ink);border-radius:14px;cursor:pointer">キャラをえらびなおす</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T = THREE;
const GOAL_Z = 880;
const W = 80;            // コース幅
const EDGE = W/2 - 0.9;  // 走れる左右の限界

/* ---------- 基本セットアップ ---------- */
const scene = new T.Scene();
scene.background = new T.Color(0x8fdcff);
scene.fog = new T.Fog(0x8fdcff, 130, 330);

const camera = new T.PerspectiveCamera(58, innerWidth/innerHeight, 0.1, 900);
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

scene.add(new T.HemisphereLight(0xffffff, 0x88bbdd, 1.0));
const sun = new T.DirectionalLight(0xfff3d0, 0.75);
sun.position.set(-30, 60, -20); scene.add(sun);

const matCache = new Map();
const mat = (c)=>{ if(!matCache.has(c)) matCache.set(c, new T.MeshLambertMaterial({color:c})); return matCache.get(c); };
const box = (w,h,d,c)=> new T.Mesh(new T.BoxGeometry(w,h,d), mat(c));
const ball = (r,c)=> new T.Mesh(new T.SphereGeometry(r,12,9), mat(c));
const cyl = (rt,rb,h,c)=> new T.Mesh(new T.CylinderGeometry(rt,rb,h,10), mat(c));

/* ---------- コース ---------- */
const platforms = [];   // {mesh, hw, hd, top, move?, prevX}
function floor(z0, z1, color=0xffb3c7, w=W, y=0, h=1){
  const d = z1 - z0;
  const m = box(w, h, d, color);
  m.position.set(0, y - h/2, (z0+z1)/2);
  scene.add(m);
  platforms.push({mesh:m, hw:w/2, hd:d/2, top:y, cx:0, cz:(z0+z1)/2, kx:0, kz:0, prevX:0});
  return m;
}
function pad(x, z, w, d, y, color, move){
  const m = box(w, 0.8, d, color);
  m.position.set(x, y-0.4, z); scene.add(m);
  const p = {mesh:m, hw:w/2, hd:d/2, top:y, cx:x, cz:z, kx:0, kz:0, move, prevX:x};
  platforms.push(p); return p;
}
// 坂：kx が横の傾き（すべり台）、kz が前後の傾き
function ramp(x, z0, z1, w, yStart, yEnd, kx, color){
  const d = z1 - z0, cz = (z0+z1)/2, kz = (yEnd-yStart)/d, top = (yStart+yEnd)/2;
  const m = box(w, 0.8, d*Math.sqrt(1+kz*kz), color);
  m.position.set(x, top-0.4, cz);
  m.rotation.x = -Math.atan(kz); m.rotation.z = Math.atan(kx);
  scene.add(m);
  const p = {mesh:m, hw:w/2, hd:d/2, top, cx:x, cz, kx, kz, prevX:x};
  platforms.push(p); return p;
}
function topOf(p, x, z){ return p.top + (p.kx?(x-p.cx)*p.kx:0) + (p.kz?(z-p.cz)*p.kz:0); }

// 壁（ジグザグ用・すべり台のガード）
const walls = [];
function wall(x, z, w, d, h, color=0x6b5bb5, y0=0){
  const m = box(w, h, d, color); m.position.set(x, y0+h/2, z); scene.add(m);
  walls.push({x, z, hw:w/2, hd:d/2, top:y0+h});
}
function rail(z0, z1, color=0xff8fb1){
  [-(W/2-0.5), (W/2-0.5)].forEach(x=>{
    const m = box(1.0, 1.8, z1-z0, color);
    m.position.set(x, 0.5, (z0+z1)/2); scene.add(m);
  });
}

// 区間ごとの床
floor(-24, 44, 0xfff0a8);          // スタート
floor(44, 200, 0xffb3c7);          // 回転バー
floor(200, 350, 0xffd0e0);         // 振り子
// 350-444 は谷（動く足場）
floor(444, 620, 0xb9e8ff);         // 動く壁＋大玉
// 620-656 のぼり坂 / 656-716 バンクすべり台（横に流される）
ramp(0, 620, 656, W, 0, 6, 0, 0xffc98f);
ramp(-21, 656, 716, 38, 6, 1,  0.30, 0xffe08a);   // 左レーン：左へすべる
ramp( 21, 656, 716, 38, 6, 1, -0.30, 0xffe08a);   // 右レーン：右へすべる
wall(0, 686, 1.6, 60, 8, 0xef5b5b);               // 中央のしきり：どちらかを選ぶ
[-40, 40].forEach(x=> wall(x, 668, 1.6, 96, 6, 0x6b5bb5));  // 坂の外側ガード

floor(716, GOAL_Z+18, 0xd8c6ff);   // ジグザグ＋段差＋ゴール
rail(-24, 350); rail(444, 620); rail(716, GOAL_Z+18);

// ジグザグの壁（まんなかだけでは通れない）
wall(-15, 754, 50, 3, 4.5, 0x6b5bb5);
wall( 15, 780, 50, 3, 4.5, 0x6b5bb5);
wall(-15, 806, 50, 3, 4.5, 0x6b5bb5);
const GATES = [{z:754,x:27},{z:780,x:-27},{z:806,x:27}];

// 装飾の丘
for(let i=0;i<72;i++){
  const h = ball(8 + Math.random()*12, [0x9de89a,0x86dcc9,0xbef07f][i%3]);
  h.position.set((Math.random()<.5?-1:1)*(56+Math.random()*74), -4, Math.random()*780-24);
  scene.add(h);
}

// ゴールゲート
const gate = new T.Group();
[-38,38].forEach(x=>{const p=cyl(1,1,12,0xffffff); p.position.set(x,6,0); gate.add(p);});
const bar = box(77,2.4,1.4,0xff5f7e); bar.position.set(0,12,0); gate.add(bar);
gate.position.z = GOAL_Z; scene.add(gate);
const tape = box(77,.3,.2,0xffffff); tape.position.set(0,1.2,GOAL_Z); scene.add(tape);

/* ---------- 障害物 ---------- */
const obstacles = [];

// 回転バー
function rotor(z, len, speed, y=1.1, xoff=0){
  const g = new T.Group(); g.position.set(xoff, 0, z);
  const post = cyl(.5,.5,y+1.2,0xffffff); post.position.y=(y+1.2)/2; g.add(post);
  const b = box(len, 1.1, 1.1, 0xffd447); b.position.y = y; g.add(b);
  const b2 = box(1.1,1.1,len, 0xff9f45); b2.position.y = y; g.add(b2);
  scene.add(g);
  obstacles.push({type:'rotor', g, len, speed, y, a:Math.random()*6});
}
// 中央をふさぐ列と、両サイドをふさぐ列を交互に置く
[62, 94, 126, 158, 188].forEach((z,i)=>{
  if(i%2===0){
    rotor(z, 46, (i%4?-1:1)*(0.8+i*0.07), 1.1, 0);              // まんなかをふさぐ
  } else {
    [-26, 26].forEach((x,k)=> rotor(z, 30, (k?-1:1)*(0.85+i*0.07), 1.1, x));
  }
});

// 振り子ハンマー
function pendulum(z, phase, speed, xoff=0){
  const piv = new T.Group(); piv.position.set(xoff, 10, z); scene.add(piv);
  const arm = cyl(.22,.22,8,0xffffff); arm.position.y=-4; piv.add(arm);
  const head = ball(1.7, 0xff5f7e); head.position.y=-8; piv.add(head);
  obstacles.push({type:'pend', piv, head, phase, speed, r:1.7});
}
[[214,[-30,-10,10,30]],[246,[-20,0,20]],[278,[-32,-12,8,28]],[310,[-24,-4,16,36]],[338,[-28,-8,12,32]]]
  .forEach(([z,xs],i)=> xs.forEach((x,k)=> pendulum(z, i*1.4+k*0.9, 0.9, x)));

// 動く足場（谷）
const hoverPads = [];
[[364,3.5,.36,0],[386,4.5,.3,1.7],[408,3.0,.4,3.2],[430,4.0,.28,4.6]].forEach(([z,amp,sp,ph])=>{
  [-27, -9, 9, 27].forEach((x,k)=>{
    const p = pad(x, z, 16, 16, 0, 0x8ef07a, {amp, sp, ph:ph+k*1.6, base:x});
    hoverPads.push(p);
  });
});

function updateDemons(dt){
  for(const d of demons){
    // いちばん近いレーサーをねらう
    let best=null, bd=1e9;
    for(const r of racers){
      if(r.finished || r.z < d.z0-30 || r.z > d.z1+10) continue;
      const dist = Math.hypot(r.x-d.x, (r.z-d.z)*0.7);
      if(dist < bd){ bd = dist; best = r; }
    }
    if(d.holding){ best = null; }
    let tx = d.holding ? d.x : (best ? best.x : Math.sin(clock*0.7)*26);
    if(d.mode==='hammer'){                       // 人が集まっているほうをねらう
      let sum=0, cnt=0;
      for(const r of racers){
        if(r.finished || r.z < d.z0-25 || r.z > d.z1+10) continue;
        sum += r.x; cnt++;
      }
      if(cnt) tx = sum/cnt;
    }
    const tz = d.holding ? d.z : (best ? Math.min(d.z1, Math.max(d.z0, best.z + 2)) : (d.z0+d.z1)/2);
    d.x += Math.max(-1,Math.min(1,(tx-d.x)*0.8)) * (d.mode==='hammer'?21:15) * dt;
    d.z += Math.max(-1,Math.min(1,(tz-d.z)*0.8)) * (d.mode==='hammer'?16:12) * dt;
    d.z = Math.max(d.z0, Math.min(d.z1, d.z));
    const gt = groundAt(d.x, d.z, 999);
    const gy = gt.top > -Infinity ? gt.top : 0;
    d.g.position.set(d.x, gy + 1.1 + Math.sin(clock*3 + d.z0)*0.35, d.z);
    d.g.rotation.y = Math.atan2(tx-d.x, 2) * 0.6 + Math.PI;
    d.g.rotation.z = Math.sin(clock*6)*0.05;

    if(d.cool>0) d.cool -= dt;
    if(d.holding && d.holding.grabbed !== d) d.holding = null;
    // 出現の合図
    if(!d.seen && player && player.z > d.z0-70 && player.z < d.z1){
      d.seen = true; sfx('hit');
      telop(d.mode==='hammer' ? 'コズがハンマーをふりまわしている！' : 'あくまの「コズ」があらわれた！');
    }
    // ハンマー攻撃
    if(d.mode==='hammer'){
      d.t += dt;
      let near = false;
      for(const r of racers){
        if(r.finished) continue;
        if(Math.hypot(r.x-d.x, r.z-d.z) < 10){ near = true; break; }
      }
      if(d.phase==='idle'){
        d.ham.rotation.y = -1.6 + Math.sin(clock*2)*0.2;
        if(near && d.t > 0.35){ d.phase='wind'; d.t=0; }
      } else if(d.phase==='wind'){
        d.ham.rotation.y = -1.6 - d.t*3.4;
        if(d.t > 0.35){
          d.phase='swing'; d.t=0;
          if(player && Math.hypot(player.x-d.x, player.z-d.z) < 18) sfx('dash');
        }
      } else if(d.phase==='swing'){
        d.ham.rotation.y = -2.8 + d.t*16;                 // 大きく一回転ぎみになぎはらう
        // 柄ぜんたいが当たり判定（まとめてなぎ倒す）
        const ang = d.ham.rotation.y + d.g.rotation.y;
        const ax = Math.cos(ang), az = -Math.sin(ang);
        for(const r of racers){
          if(r.finished || r.stun>0 || r.invuln>0) continue;
          const rx = r.x - d.x, rz = r.z - d.z;
          const t2 = Math.max(0, Math.min(11.5, rx*ax + rz*az));   // 柄の長さ11.5m
          const px = ax*t2, pz = az*t2;
          if(Math.hypot(rx-px, rz-pz) < 3.6 && r.y < 5){
            r.hit(rx || (Math.random()-.5), -1.6, 22);
            if(r.isPlayer) telop('コズのハンマーにふきとばされた！');
          }
        }
        if(d.t > 0.40){ d.phase='cool'; d.t=0; }
      } else {
        d.ham.rotation.y += (-1.6 - d.ham.rotation.y)*Math.min(1, dt*5);
        if(d.t > 0.45){ d.phase='idle'; d.t=0; }
      }
      continue;
    }

    // つかまえる（1体ずつ）
    if(!d.holding && d.cool<=0){
      for(const r of racers){
        if(r.finished || r.stun>0 || r.invuln>0 || r.grabbed) continue;
        if(Math.hypot(r.x-d.x, r.z-d.z) < 2.9 && Math.abs(r.y - (d.g.position.y-1.1)) < 3.5){
          r.grabbed = d; r.grabT = 0; r.mash = 0; d.holding = r;
          if(r.isPlayer){ telop('コズにつかまった！ れんだでにげろ！'); sfx('hit'); }
          break;
        }
      }
    }
  }
}

class Racer{
  constructor(i, isPlayer){
    const c = SKINS[i];
    this.i=i; this.isPlayer=isPlayer; this.color=c.color; this.name=c.name;
    Object.assign(this, makeChar(c.color, c.style, c.scale, isPlayer));
    this.scaleBase = c.scale;
    this.x = ((i%10)-4.5)*7.0; this.y=0; this.z=-8 - Math.floor(i/10)*4.5;
    this.vx=0; this.vy=0; this.vz=0;
    const v = isPlayer ? 0 : (Math.random()-0.5);              // ごくわずかな個体差
    this.speed = BASE.speed*(1+v*0.05); this.jumpPow = BASE.jump;
    this.stun=0; this.grounded=true; this.standing=null;
    this.check=0; this.finished=false; this.time=0; this.place=0; this.invuln=0;
    this.lane = ((i%10)-4.5)*(W*0.085) + (Math.random()-0.5)*6;
    this.wander = Math.random()*6; this.skill = BASE.skill + (isPlayer?0:v*0.08);
    this.tilt=0; this.walk=0; this.boost=0; this.dashT=0;
    this.grabbed=null; this.mash=0; this.grabT=0;
  }
  freeFromGrab(thrown){
    const d = this.grabbed;
    if(d){ d.holding = null; d.cool = thrown ? 1.5 : 2.4; }
    this.grabbed = null; this.mash = 0; this.grabT = 0;
    if(thrown){
      this.hit((Math.random()-.5)*2, -2.5, 15);
      if(this.isPlayer) telop('コズになげられた！');
    } else {
      this.invuln = 1.5; this.vy = 7; this.vz = 0;
      if(this.isPlayer){ telop('ふりほどいた！'); sfx('dash'); }
    }
  }
  respawn(zOverride){
    this.z = (zOverride !== undefined) ? zOverride : CHECKS[this.check]; this.x = ((this.i%9)-4)*6.5;
    const gt = groundAt(this.x, this.z, 999);
    this.y = (gt.top > -Infinity ? gt.top : 0) + 2.2;
    this.vx=this.vy=this.vz=0; this.stun=0; this.invuln=1.6; this.tilt=0;
    if(this.grabbed) this.freeFromGrab(false);
    if(this.isPlayer){ toast('チェックポイントにもどる'); sfx('cp'); }
  }
  hit(dx, dz, power){
    if(this.isPlayer) sfx('hit');
    this.dashT = 0;
    const l = Math.hypot(dx,dz)||1;
    this.vx += dx/l*power; this.vz += dz/l*power*.7;
    this.vy = Math.max(this.vy, 5.5); this.stun = .75;
  }
  jump(){ if(this.grounded && this.stun<=0){ this.vy = this.jumpPow; this.grounded=false; if(this.isPlayer) sfx('jump'); } }
}

/* ---------- 地面判定 ---------- */
function groundAt(x, z, y, r=.5){
  let best = -Infinity, obj=null;
  for(const p of platforms){
    if(Math.abs(x-p.cx) > p.hw + r*0.6) continue;
    if(Math.abs(z-p.cz) > p.hd + r*0.6) continue;
    const t = topOf(p, x, z);
    if(t <= y + 0.5 && t > best){ best=t; obj=p; }
  }
  return {top:best, obj};
}
function hasGround(x, z){
  for(const p of platforms){
    if(Math.abs(x-p.cx) <= p.hw && Math.abs(z-p.cz) <= p.hd) return true;
  }
  return false;
}

/* ---------- 効果音 ---------- */
let actx=null;
function initAudio(){ if(!actx) try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
function beep(f, dur, type='square', vol=.06, slide=0){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f, actx.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide), actx.currentTime+dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
}
function sfx(t){
  if(t==='jump') beep(520,.14,'square',.05,260);
  if(t==='hit'){ beep(150,.22,'sawtooth',.08,-90); }
  if(t==='ring'){ beep(880,.08,'triangle',.07); setTimeout(()=>beep(1320,.1,'triangle',.06),70); }
  if(t==='dash') beep(300,.3,'sawtooth',.05,700);
  if(t==='cp') beep(660,.1,'triangle',.06,220);
  if(t==='count') beep(440,.12,'square',.05);

// 正方形に切り出して丸くマスク
function cropSquare(src, sw, sh, mirror){
  const S = 256;
  shotEl.width = S; shotEl.height = S;
  const ctx = shotEl.getContext('2d');
  const side = Math.min(sw, sh);
  ctx.save();
  ctx.beginPath(); ctx.arc(S/2, S/2, S/2, 0, Math.PI*2); ctx.clip();
  if(mirror){ ctx.translate(S,0); ctx.scale(-1,1); }
  ctx.drawImage(src, (sw-side)/2, (sh-side)/2 - sh*0.05, side, side, 0, 0, S, S);
  ctx.restore();
  return shotEl;
}

/* ---------- AI ---------- */
function ai(r, dt){
  // 目標のx
  let tx = r.lane + Math.sin(clock*0.45 + r.wander)*9;      // 自分のレーン＋大きく蛇行

  // 谷では足場を狙う
  const gate = GATES.find(gt=> gt.z > r.z - 3 && gt.z - r.z < 46);
  if(gate) tx = gate.x;
  if(r.z > 640 && r.z < 720) tx = (r.x < 0 ? -21 : 21);   // すべり台はレーン中央を保つ
  if(r.z > 344 && r.z < 452){
    const cand = hoverPads.filter(p=> p.mesh.position.z > r.z - 3);
    if(cand.length){
      const zmin = Math.min(...cand.map(p=> p.mesh.position.z));
      const row = cand.filter(p=> p.mesh.position.z <= zmin + 1);
      row.sort((a,b)=> Math.abs(a.mesh.position.x-r.x) - Math.abs(b.mesh.position.x-r.x));
      tx = row[0].mesh.position.x;
    }
  }
  // 回転バーは端／中央のあいている側へまわりこむ
  for(const o of obstacles){
    if(o.type!=='rotor') continue;
    const dz = o.g.position.z - r.z;
    if(dz < 0 || dz > 26) continue;
    const reach = o.len/2 + 2;
    const ox = o.g.position.x;
    if(Math.abs(tx - ox) < reach){
      const left = ox - reach - 3, right = ox + reach + 3;
      tx = (Math.abs(left - r.x) < Math.abs(right - r.x) && left > -EDGE) || right > EDGE ? left : right;
    }
  }
  tx = Math.max(-EDGE+2, Math.min(EDGE-2, tx));

  // 危険物をよける
  for(const o of obstacles){
    if(o.type==='pend'){
      const dz=o.piv.position.z - r.z;
      if(dz>0 && dz<9){ const hx=o.head.getWorldPosition(new T.Vector3()).x;
        if(Math.abs(hx-r.x)<3.5*r.skill) tx = hx + (hx>0?-4.5:4.5); }
    }
    if(o.type==='roll'){
      const dz=o.m.position.z - r.z;
      if(dz>0 && dz<12 && Math.abs(o.m.position.x-r.x)<2.6) tx = o.m.position.x + (o.m.position.x>0?-3.6:3.6);
    }
    if(o.type==='slide'){
      const dz=o.m.position.z - r.z;
      if(dz>0 && dz<7 && Math.abs(o.m.position.x-r.x)<3.6*r.skill) tx = o.m.position.x + (o.m.position.x>0?-5:5);
    }
  }
  r.x += Math.max(-1,Math.min(1,(tx-r.x)*0.5)) * 11 * dt;

  // ジャンプ判定
  if(r.grounded && r.stun<=0){
    const ahead = r.z + 2.6;
    if(!hasGround(r.x, ahead) && Math.random()<r.skill) r.jump();
    for(const o of obstacles){
      if(o.type==='rotor'){
        const dz=o.g.position.z - r.z;
        if(dz>0 && dz<3.2 && Math.random()<r.skill*0.9) r.jump();
      }
      if(o.type==='slide'){
        const dz=o.m.position.z - r.z;
        if(dz>0 && dz<2.4 && Math.abs(o.m.position.x-r.x)<3.4) r.jump();
      }
    }
  }
  r.vz = r.speed * (r.stun>0 ? 0 : 1);
}

function tryDash(r){
  if(r.boost>0 && r.dashT<=0 && r.stun<=0 && !r.finished){
    r.boost--; r.dashT=1.5; if(r.isPlayer) sfx('dash');
  }
}
function pickRings(r, dt){
  for(const k of rings){
    if(k.taken>0) continue;
    if(Math.abs(r.z-k.z)<1.5 && Math.abs(r.x-k.m.position.x)<1.6 && r.y<3.2){
      k.taken=5; k.m.visible=false;
      if(r.boost<3) r.boost++;
      if(r.isPlayer) sfx('ring');
    }
  }
}

/* ---------- 障害物の更新＆当たり ---------- */
const tmp = new T.Vector3();
function updateObstacles(dt){
  for(const o of obstacles){
    if(o.type==='rotor'){ o.a += o.speed*dt; o.g.rotation.y = o.a; }
    if(o.type==='pend'){ o.piv.rotation.z = Math.sin(clock*o.speed + o.phase)*1.05; }
    if(o.type==='roll'){
      o.m.position.z -= o.speed*dt;
      o.m.rotation.x -= o.speed/o.r*dt;
      if(o.m.position.z < 452){ o.m.position.z = o.z0; o.m.position.x = (Math.random()*72-36); }
    }
    if(o.type==='slide'){
      o.m.position.x = (o.xoff||0) + Math.sin(clock*o.speed + o.phase)*o.amp;
    }
  }
  for(const k of rings){
    k.m.rotation.y += dt*2.2;
    if(k.taken>0){ k.taken-=dt; if(k.taken<=0) k.m.visible=true; }
  }
  for(const p of platforms){
    if(!p.move) continue;
    p.prevX = p.mesh.position.x;
    p.mesh.position.x = (p.move.base||0) + Math.sin(clock*p.move.sp + p.move.ph)*p.move.amp;
    p.cx = p.mesh.position.x;
  }
}

function collide(r){
  if(r.stun>0 || r.invuln>0) return;
  for(const o of obstacles){
    if(o.type==='rotor'){
      const dz = o.g.position.z - r.z;
      if(Math.abs(dz) > 6.5 || r.y > o.y+1.3) continue;
      for(const ang of [o.a, o.a+Math.PI/2]){
        const dx=Math.sin(ang), dzz=Math.cos(ang);
        let t = (r.x-o.g.position.x)*dx + (r.z-o.g.position.z)*dzz;
        t = Math.max(-o.len/2, Math.min(o.len/2, t));
        const cx=o.g.position.x+dx*t, cz=o.g.position.z+dzz*t;
        if(Math.hypot(r.x-cx, r.z-cz) < 1.15){
          const s = Math.sign(o.speed);
          r.hit((r.x-cx) - dzz*s*3, (r.z-cz) + dx*s*3, 9);
          return;
        }
      }
    }
    if(o.type==='pend'){
      o.head.getWorldPosition(tmp);
      if(Math.hypot(r.x-tmp.x, r.z-tmp.z, (r.y+.7)-tmp.y) < o.r+.7){
        r.hit(r.x-tmp.x, -1.5, 11); return;
      }
    }
    if(o.type==='roll'){
      const m=o.m.position;
      if(Math.hypot(r.x-m.x, r.z-m.z) < o.r+.6 && r.y < m.y+o.r){
        r.hit(r.x-m.x, -2.2, 9); return;
      }
    }
    if(o.type==='slide'){
      const m=o.m.position;
      if(Math.abs(r.x-m.x)<o.hw+.5 && Math.abs(r.z-m.z)<o.hd+.5 && r.y<2.0){
        r.hit(r.x-m.x, -1.6, 8); return;
      }
    }
  }
}

/* ---------- 物理 ---------- */
function step(r, dt){
  if(r.finished){ r.z += 6*dt; r.vy-=26*dt; r.y=Math.max(0,r.y+r.vy*dt); if(r.y<=0){r.y=0;r.vy=8;} return; }
  if(r.stun>0) r.stun -= dt;

  // コズにつかまっている：れんだでふりほどく
  if(r.grabbed){
    const d = r.grabbed;
    r.grabT += dt;
    const gt2 = groundAt(d.x, d.z, 999);
    r.x = d.x; r.z = d.z + 1.9;
    r.y = (gt2.top > -Infinity ? gt2.top : 0) + 1.9;
    r.vx = r.vy = r.vz = 0; r.grounded = false;
    const need = 9;
    const done = r.isPlayer ? (r.mash >= need) : (r.grabT > 0.7 + (1-r.skill)*2.2);
    if(done) r.freeFromGrab(false);
    else if(r.grabT > 3.0) r.freeFromGrab(true);
    r.g.position.set(r.x, r.y, r.z);
    r.g.rotation.z = Math.sin(clock*24)*0.35;
    r.legs[0].rotation.x = Math.sin(clock*20)*1.2;
    r.legs[1].rotation.x = Math.sin(clock*20+2)*1.2;
    r.arms[0].rotation.x = Math.sin(clock*18)*1.7;
    r.arms[1].rotation.x = Math.sin(clock*18+3)*1.7;
    r.sh.visible = false;
    return;
  }

  if(r.dashT>0) r.dashT -= dt;
  const dash = r.dashT>0 ? 1.6 : 1;
  pickRings(r, dt);

  if(r.isPlayer){
    const move = (key.l?1:0)-(key.r?1:0);
    if(r.stun<=0){
      r.x += move*8.6*dt;
      r.vz = (key.f ? r.speed : r.speed*0.15) * dash;
      if(key.j) r.jump();
    } else r.vz = 0;
  } else {
    ai(r, dt);
    r.vz *= dash;
    if(r.boost>0 && r.dashT<=0 && Math.random() < dt*0.6) tryDash(r);
  }

  // 移動＋ふっとびの慣性
  r.x += r.vx*dt;
  r.z += r.vz*dt;
  r.vx *= 0.90;
  r.vy -= 26*dt; r.y += r.vy*dt;

  r.x = Math.max(-EDGE, Math.min(EDGE, r.x));

  // 壁にぶつかったら止まる
  for(const wl of walls){
    if(r.y > wl.top - 0.2) continue;
    const dx = r.x - wl.x, dz = r.z - wl.z;
    const ox = wl.hw + .55 - Math.abs(dx), oz = wl.hd + .55 - Math.abs(dz);
    if(ox > 0 && oz > 0){
      if(ox < oz){ r.x = wl.x + (dx<0?-1:1)*(wl.hw+.55); r.vx = 0; }
      else       { r.z = wl.z + (dz<0?-1:1)*(wl.hd+.55); if(dz < 0) r.vz = 0; }
    }
  }

  const g = groundAt(r.x, r.z, r.y);
  if(g.top > -Infinity && r.y <= g.top + 0.02 && r.vy <= 0){
    r.y = g.top; r.vy = 0; r.grounded = true;
    if(g.obj && g.obj.move) r.x += g.obj.mesh.position.x - g.obj.prevX;
    if(g.obj && g.obj.kx) r.vx -= g.obj.kx * 30 * dt;      // すべり台で横に流される
    r.standing = g.obj;
  } else if(r.y > g.top + 0.05){
    r.grounded = false;
  }

  if(r.y < -1.2){                       // 落ちたら即もどす
    if(r.z > 340 && r.z < 450) r.respawn(290);   // 谷は少し手前（290m）から再スタート
    else r.respawn();
  }

  // チェックポイント通過
  while(r.check < CHECKS.length-1 && r.z >= CHECKS[r.check+1]){
    r.check++;
    if(r.isPlayer){ toast('チェックポイント '+r.check); sfx('cp'); }
  }
  if(r.invuln>0){ r.invuln -= dt; r.g.visible = (Math.floor(r.invuln*12)%2===0); }
  else r.g.visible = true;

  if(r.z >= GOAL_Z && !r.finished){
    r.finished = true; r.time = clock;
    finishOrder.push(r); r.place = finishOrder.length;
    if(r.isPlayer) showResult();
  }
  collide(r);

  // 見た目
  // ---- 走るモーション ----
  const spd = Math.min(1.35, Math.abs(r.vz)/r.speed);          // 走る速さ 0〜1.35
  const running = r.grounded && r.stun<=0 && spd > 0.15;
  r.walk += dt * (running ? 7 + spd*13 : 6);
  const sw = Math.sin(r.walk), sw2 = Math.cos(r.walk);
  let bob = 0, lean = 0;

  if(r.stun>0){                                                 // ふっとび中はジタバタ
    r.legs[0].rotation.x = Math.sin(clock*22)*1.3;
    r.legs[1].rotation.x = Math.sin(clock*22+2)*1.3;
    r.arms[0].rotation.x = Math.sin(clock*19+1)*1.6;
    r.arms[1].rotation.x = Math.sin(clock*19+3)*1.6;
  } else if(!r.grounded){                                       // ジャンプ中は足をたたむ
    r.legs[0].rotation.x = -0.95; r.legs[1].rotation.x = 0.55;
    r.arms[0].rotation.x = -1.5;  r.arms[1].rotation.x = -1.5;
  } else {                                                      // 接地：左右交互のストライド
    const amp = 0.55 + spd*0.75;
    r.legs[0].rotation.x = -sw*amp;
    r.legs[1].rotation.x =  sw*amp;
    // 前に出した脚だけひざを持ち上げる
    r.legs[0].position.y = r.legs[0].baseY + Math.max(0,-sw)*0.09*spd;
    r.legs[1].position.y = r.legs[1].baseY + Math.max(0, sw)*0.09*spd;
    r.arms[0].rotation.x =  sw*(0.5+spd*0.6);
    r.arms[1].rotation.x = -sw*(0.5+spd*0.6);
    r.arms[0].rotation.z =  0.22; r.arms[1].rotation.z = -0.22;
    bob  = Math.abs(sw2)*0.07*spd;                              // 1歩ごとに上下
    lean = -0.10 - spd*0.16;                                    // 前かがみ
  }

  r.tilt += ((r.stun>0 ? 1.2 : 0) - r.tilt)*Math.min(1,dt*8);
  r.g.position.set(r.x, r.y + bob, r.z);
  r.g.rotation.x = lean;
  r.g.rotation.z = r.tilt*Math.sin(clock*14);
  r.g.rotation.y = Math.max(-.5,Math.min(.5,-r.vx*0.06));
  const sq = running ? 1 - Math.abs(sw2)*0.05*spd : 1;          // 着地のたびに軽くつぶれる
  const st = (r.dashT>0 ? 1 + Math.sin(clock*30)*.05 : 1) * (r.scaleBase||1);
  r.g.scale.set(st*(2-sq)*0.98, st*sq, st*(2-sq)*0.98);
  const gs = groundAt(r.x, r.z, r.y);
  r.sh.visible = gs.top > -Infinity;
  r.sh.position.set(r.x, (gs.top>-Infinity?gs.top:0)+0.03, r.z);
  const sc = Math.max(.35, 1 - (r.y - (gs.top>-Infinity?gs.top:0))*0.12);
  r.sh.scale.set(sc,sc,sc);
}

/* ---------- レーサー同士のぶつかり（じゃま） ---------- */
function racerCollisions(dt){
  for(let i=0;i<racers.length;i++){
    const a = racers[i];
    if(a.finished || a.grabbed) continue;
    for(let j=i+1;j<racers.length;j++){
      const b = racers[j];
      if(b.finished || b.grabbed) continue;
      const dx = a.x-b.x, dz = a.z-b.z;
      if(Math.abs(dx) > 1.6 || Math.abs(dz) > 1.6) continue;
      if(Math.abs(a.y-b.y) > 1.6) continue;
      const dist = Math.hypot(dx, dz) || 0.01;
      const push = (1.6 - dist) * 0.5;
      a.x += dx/dist*push; b.x -= dx/dist*push;
      a.z += dz/dist*push*0.5; b.z -= dz/dist*push*0.5;

      // ダッシュ中の相手は体当たりでふきとばす
      const tackle = (att, def)=>{
        if(att.dashT<=0 || def.stun>0 || def.invuln>0) return false;
        def.hit(-dx/dist * (att===a?1:-1), -1.2, 13);
        att.dashT = Math.min(att.dashT, 0.25);
        if(att.isPlayer) telop(def.name+' をふきとばした！');
        if(def.isPlayer) telop(att.name+' にじゃまされた！');
        return true;
      };
      if(!tackle(a,b)) tackle(b,a);
    }
  }
}

/* ---------- HUD ---------- */
function updateHUD(){
  const me = player;
  const sorted = [...racers].sort((a,b)=> (b.finished?1e6-b.place:b.z) - (a.finished?1e6-a.place:a.z));
  const pos = sorted.indexOf(me)+1;
  $('rank').innerHTML = 'じゅんい<b>'+pos+'<span style="font-size:15px">/'+N+'</span></b>';
  $('timer').textContent = clock.toFixed(2);
  $('boost').innerHTML = '⚡'.repeat(me.boost) + '<span style="opacity:.2">'+'⚡'.repeat(3-me.boost)+'</span>';
  const lead = sorted[0];
  if(lead !== leader){ if(leader) telop(lead.name + ' がトップにおどりでた！'); leader = lead; }
  if(!nearGoal && me.z > GOAL_Z-70){ nearGoal=true; telop('ゴールまであとすこし！'); }
  racers.forEach((r,i)=>{
    dots[i].style.left = Math.max(0,Math.min(100, (r.z/GOAL_Z)*100))+'%';
  });
}
function showResult(){
  state='done';
  // 残りのAIの想定順位を確定
  const rest = racers.filter(r=>!r.finished).sort((a,b)=>b.z-a.z);
  rest.forEach(r=>{ finishOrder.push(r); r.place=finishOrder.length; r.time = clock + (GOAL_Z-r.z)/r.speed; });
  const me = player;
  $('rTitle').textContent = me.place===1 ? 'ゆうしょう！' : me.place+'いでゴール';
  if(best===null || me.time < best) best = me.time;
  $('rSub').innerHTML = 'タイム '+me.time.toFixed(2)+'びょう　<span style="opacity:.75">ベスト '+best.toFixed(2)+'</span>';
  sfx(me.place===1?'win':'lose');
  if(me.place<=3) confetti();
  const show = finishOrder.filter(r=> r.place<=8 || r.isPlayer);
  $('list').innerHTML = show.map((r,i)=>
    (i>0 && r.place - show[i-1].place > 1 ? '<li style="opacity:.4;justify-content:center">…</li>' : '') +
    `<li class="${r.isPlayer?'me':''}"><span><span class="no">${r.place}い</span>${r.name}</span><span>${r.time.toFixed(2)}</span></li>`).join('');
  setTimeout(()=> $('result').classList.add('on'), 900);
}

/* ---------- カメラ ---------- */
const camPos = new T.Vector3(0, 6, -10);
function updateCamera(dt){
  const me = player;
  const want = new T.Vector3(me.x*0.5, me.y + 7.4, me.z - 14.5);
  camPos.lerp(want, Math.min(1, dt*4.5));
  camera.position.copy(camPos);
  camera.lookAt(me.x*0.55, me.y + 1.6, me.z + 8);
}

/* ---------- ループ ---------- */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = Math.min(0.033, (now-last)/1000); last = now;

  if(state==='select'){
    updateObstacles(dt);
    if(racers.length) updateCamera(dt);
    updateNameTag();
    renderer.render(scene, camera);
    if(telopT>0){ telopT-=dt; if(telopT<=0) $('telop').style.opacity=0; }
    return;
  }
  if(state==='count'){
    countdown -= dt;
    const n = Math.ceil(countdown-0.6);
    const el = $('big');
    const txt = countdown<=0.6 ? 'ＧＯ！' : String(Math.max(1,n));
    if(el.textContent !== txt){
      el.textContent = txt; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
      sfx(txt==='ＧＯ！' ? 'go' : 'count');
    }
    if(countdown <= 0){ state='play'; el.textContent=''; }
    updateObstacles(dt);
  } else if(state==='play'){
    clock += dt;
    updateObstacles(dt);
    updateDemons(dt);
    racers.forEach(r=> step(r, dt));
    racerCollisions(dt);
    updateHUD();
  } else {
    updateObstacles(dt);
    racers.forEach(r=> step(r, dt));
  }
  updateCamera(dt);
  updateNameTag();
  const gEl = $('grab');
  if(player && player.grabbed){
    gEl.classList.add('on');
    gEl.querySelector('b').style.width = Math.min(100, player.mash/9*100)+'%';
  } else if(gEl.classList.contains('on')) gEl.classList.remove('on');
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').style.opacity=0; }
  if(telopT>0){ telopT-=dt; if(telopT<=0) $('telop').style.opacity=0; }
  const targetFov = (player && player.dashT>0) ? 68 : 58;
  if(Math.abs(camera.fov-targetFov)>0.1){ camera.fov += (targetFov-camera.fov)*Math.min(1,dt*6); camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
}
racers = COLORS.map((c,i)=> new Racer(i, i===sel));
player = racers[sel];
state = 'select';
requestAnimationFrame(loop);
</script>
